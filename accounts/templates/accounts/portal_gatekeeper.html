<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvalX | Project Management Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden; /* Important: prevents scrollbars when logo fills screen */
        }

        /* Full Screen Background Logo */
        .bg-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* This is the magic: it scales the logo to fill the screen without stretching */
            object-fit: contain; 
            padding: 20px; /* Optional: keeps the logo slightly away from the extreme edges */
            box-sizing: border-box;

            opacity: 0.07; /* Lowered opacity because the logo is now massive */
            z-index: -1;   /* Keeps it behind the login buttons */
            pointer-events: none;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
            z-index: 1;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 500;
            color: #0056b3;
            text-shadow: 0 0 10px rgba(255,255,255,0.8); /* Helps text stand out over logo */
        }
        .portal-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }
        .login-card {
            /* Using a slight blur effect (Glassmorphism) looks great over a full-page logo */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px); 
            border: 1px solid #e0e0e0;
            padding: 25px;
            text-decoration: none;
            display: flex;
            justify-content: center; 
            align-items: center;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-radius: 6px;
        }
        .login-card:hover {
            border-color: #0056b3;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transform: translateY(-2px);
            background-color: #ffffff;
        }
        .login-card h2 {
            margin: 0;
            font-size: 20px;
            color: #444;
            font-weight: 500;
        }
        .footer-text {
            margin-top: 60px;
            font-size: 13px;
            color: #777;
            z-index: 1;
            background: rgba(248, 249, 250, 0.8); /* Semi-transparent background for footer */
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    {% load static %}

    <img src="{% static 'assets/branding/logo2.png' %}" class="bg-logo" alt="AISAT Logo">

    <div class="header">
        <h1>EvalX: Mini-Project Evaluation System</h1>
    </div>

    <div class="portal-container">
        <a href="/login/coordinator/" class="login-card">
            <h2>Coordinator Login</h2>
        </a>
        <a href="/login/hod/" class="login-card">
            <h2>HOD Login</h2>
        </a>
        <a href="/login/guide/" class="login-card">
            <h2>Guide Login</h2>
        </a>
        <a href="/login/team/" class="login-card">
            <h2>Team Login</h2>
        </a>
    </div>

    <div class="footer-text">
        &copy; 2026 EvalX Academic ERP System
    </div>

</body>
</html>
