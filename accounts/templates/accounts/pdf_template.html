<!DOCTYPE html>
<html>
<head>
    <style>
        @page {
            size: A4;
            margin: 15mm 15mm 15mm 15mm;
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 10pt;
            margin: 0;
            padding: 0;
        }

        /* HEADER SECTION */
        .page-header {
            position: relative;
            left: -20mm;
            width: 100%;
            height: 120px;
        }

        .page-header img {
            width: 100%;
            height: 120px;
            display: block;
            object-fit: cover; /* prevents distortion */
        }

        /* CONTENT STARTS BELOW HEADER */
        .content-wrapper {
            padding: 10px 1.5cm 1.5cm 1.5cm;
        }

        .report-title {
            text-align: center;
            font-weight: bold;
            font-size: 14pt;
            margin-bottom: 8px;
            text-decoration: underline;
        }

        .table-container {
            width: 90%;
            margin: 0 auto;
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        table {
            margin-top: 10px;
            -fs-table-paginate: paginate;
        }

        th, td { 
            border: 1px solid black; 
            padding: 5px; 
            text-align: center; 
        }

        th { 
            background-color: #e9ecef; 
            font-size: 9pt; 
        }

        .text-left { 
            text-align: left; 
            padding-left: 5px; 
        }
    </style>
</head>
<body>

    <!-- FULL WIDTH HEADER -->
    <div class="page-header">
        <img src="{{ logo_path }}">
    </div>

    <!-- CONTENT -->
    <div class="content-wrapper">
        <div class="report-title">{{ title }}</div>
        <div class="table-container">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
